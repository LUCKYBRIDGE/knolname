name: Validate nolsaju

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Ensure generative AI code is absent
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '@google/genai|GoogleGenAI|GEMINI_API_KEY|/api/naming/interpret|generateContent\(' \
            server.ts server src package.json; then
            echo "Generative AI dependency or endpoint found." >&2
            exit 1
          fi
      - name: Type check
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Backend data-sync smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/nolsaju-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/meta > /tmp/nolsaju-meta.json 2>/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done

          if [ "$ok" -ne 1 ]; then
            cat /tmp/nolsaju-server.log
            exit 1
          fi

          grep -q '"hanjaCount"' /tmp/nolsaju-meta.json
          grep -q '"surnames"' /tmp/nolsaju-meta.json
